<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eGovFrame CMS 50 기능 데모</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:#f5f7fb;color:#172033}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#111827;color:white;padding:18px;height:100vh;overflow:auto;position:sticky;top:0}.brand{font-size:20px;font-weight:900;margin-bottom:18px}.side input{width:100%;padding:9px;border-radius:8px;border:1px solid #334155;background:#172033;color:white;margin-bottom:12px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#e5edf8;padding:8px 10px;border-radius:8px;cursor:pointer}.nav button:hover,.nav button.on{background:#22304a}.main{padding:30px}.top{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf2ff;color:#175cd3;font-size:11px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px}.card{padding:16px}.card strong{display:block;font-size:27px;margin-top:5px}.panel{overflow:hidden}.head{padding:16px 18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}.primary,.ghost,.danger{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.primary{background:#175cd3;color:white}.ghost{background:#eef2f6}.danger{background:#fff0eb;color:#b42318}.grid{padding:15px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.feature{border:1px solid #e5e7eb;border-radius:11px;padding:13px;cursor:pointer}.feature:hover{border-color:#9bbcf4}.feature small{color:#175cd3}.feature b{display:block;margin:4px 0}.feature span{font-size:12px;color:#667085}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left}.empty{text-align:center;color:#667085;padding:30px!important}dialog{border:0;border-radius:14px;width:min(480px,92vw)}form{display:grid;gap:12px}form input,form textarea{padding:9px;border:1px solid #d0d5dd;border-radius:8px}.actions{display:flex;gap:6px}@media(max-width:900px){.app{grid-template-columns:200px 1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}.side{height:auto;position:relative}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.main{padding:18px}}</style></head><body><div class="app"><aside class="side"><div class="brand">eGov CMS</div><input id="search" placeholder="기능 검색"><div id="nav" class="nav"></div></aside><main class="main"><section class="top"><div><div class="badge">eGovFrame 5.0 Demo</div><h1 id="title">50개 관리 기능 데모</h1><p id="desc">기본설정, 메뉴, 권한, 회원, 게시판 등 50개 기능을 공통 CRUD 방식으로 체험합니다.</p></div><button class="primary" id="add">+ 새 항목</button></section><section class="stats"><div class="card"><span>기능 모듈</span><strong>50</strong></div><div class="card"><span>현재 기능 데이터</span><strong id="count">0</strong></div><div class="card"><span>저장 방식</span><strong style="font-size:18px">localStorage</strong></div></section><section class="panel"><div class="head"><div><b id="panelTitle">전체 기능</b><div style="font-size:12px;color:#667085;margin-top:4px">정적 데모에서도 등록/수정/삭제가 브라우저에 저장됩니다.</div></div><button class="ghost" id="reset">초기화</button></div><div id="body"></div></section></main></div><dialog id="dlg"><form id="form" method="dialog" style="padding:18px"><h3 id="dlgTitle" style="margin:0">항목 등록</h3><input id="itemTitle" placeholder="제목/키" required><textarea id="itemContent" rows="5" placeholder="내용/값"></textarea><div class="actions"><button class="primary" value="default">저장</button><button class="ghost" type="button" onclick="dlg.close()">취소</button></div></form></dialog><script>const features=[['대시보드','운영 대시보드'],['기본설정','사이트 기본설정'],['기본설정','시스템 설정'],['기본설정','환경 설정'],['메뉴','메뉴 관리'],['메뉴','메뉴 순서'],['메뉴','메뉴 노출'],['권한','역할 관리'],['권한','권한 관리'],['권한','역할-권한 매핑'],['회원','회원 관리'],['회원','회원 상세'],['회원','회원 상태'],['회원','비밀번호 초기화'],['회원','로그인 이력'],['회원','회원 그룹'],['회원','프로필 필드'],['게시판','게시판 분류'],['게시판','게시판 관리'],['게시판','게시글 관리'],['게시판','댓글 관리'],['게시판','첨부파일'],['콘텐츠','공지사항'],['콘텐츠','FAQ'],['콘텐츠','Q&A'],['콘텐츠','팝업 관리'],['콘텐츠','배너 관리'],['콘텐츠','페이지 관리'],['콘텐츠','템플릿 관리'],['콘텐츠','위젯 관리'],['공통코드','코드 그룹'],['공통코드','공통코드'],['정책','이용약관'],['정책','개인정보처리방침'],['메시지','이메일 템플릿'],['메시지','SMS 템플릿'],['메시지','발송 이력'],['파일','파일 관리'],['파일','미디어 라이브러리'],['검색','통합 검색'],['로그','접근 로그'],['로그','감사 로그'],['통계','운영 통계'],['통계','방문 통계'],['통계','콘텐츠 통계'],['운영','스케줄러'],['운영','백업 설정'],['API','API 키'],['API','API 접근 로그'],['운영','점검 모드']];let current=-1,editing=null;const key=i=>'egovcms-'+i;const load=i=>JSON.parse(localStorage.getItem(key(i))||'[]');const save=(i,v)=>localStorage.setItem(key(i),JSON.stringify(v));function renderNav(q=''){nav.innerHTML='';features.forEach((f,i)=>{if((f[0]+' '+f[1]).toLowerCase().includes(q.toLowerCase())){const b=document.createElement('button');b.textContent=(i+1)+'. '+f[1];b.onclick=()=>openFeature(i);if(i===current)b.className='on';nav.appendChild(b)}})}function renderHome(){current=-1;title.textContent='50개 관리 기능 데모';desc.textContent='기본설정, 메뉴, 권한, 회원, 게시판 등 50개 기능을 공통 CRUD 방식으로 체험합니다.';panelTitle.textContent='전체 기능';count.textContent='0';body.innerHTML='<div class="grid">'+features.map((f,i)=>`<div class="feature" onclick="openFeature(${i})"><small>${f[0]}</small><b>${i+1}. ${f[1]}</b><span>공통 CRUD 관리 화면</span></div>`).join('')+'</div>';renderNav(search.value)}function openFeature(i){current=i;editing=null;title.textContent=features[i][1];desc.textContent=features[i][0]+' 영역 관리 기능';panelTitle.textContent=features[i][1]+' 데이터';renderTable();renderNav(search.value)}function renderTable(){const rows=load(current);count.textContent=rows.length;body.innerHTML=`<table class="table"><thead><tr><th>ID</th><th>제목</th><th>내용</th><th></th></tr></thead><tbody>${rows.length?rows.map((r,idx)=>`<tr><td>${idx+1}</td><td>${esc(r.title)}</td><td>${esc(r.content)}</td><td class="actions"><button class="ghost" onclick="editItem(${idx})">수정</button><button class="danger" onclick="delItem(${idx})">삭제</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">등록된 항목이 없습니다.</td></tr>'}</tbody></table>`}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}add.onclick=()=>{if(current<0){openFeature(1);return}editing=null;itemTitle.value='';itemContent.value='';dlgTitle.textContent='항목 등록';dlg.showModal()};form.onsubmit=()=>{const rows=load(current),v={title:itemTitle.value,content:itemContent.value};if(editing===null)rows.push(v);else rows[editing]=v;save(current,rows);setTimeout(renderTable)};window.editItem=i=>{editing=i;const r=load(current)[i];itemTitle.value=r.title;itemContent.value=r.content;dlgTitle.textContent='항목 수정';dlg.showModal()};window.delItem=i=>{const rows=load(current);rows.splice(i,1);save(current,rows);renderTable()};reset.onclick=()=>{if(current>=0){localStorage.removeItem(key(current));renderTable()}};search.oninput=()=>renderNav(search.value);renderHome();</script></body></html>
