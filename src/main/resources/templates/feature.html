<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${feature.name} + ' | eGov CMS'">CMS</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="shell"><aside class="sidebar"><a class="brand" th:href="@{/admin}"><span class="brand-mark">eG</span><span>eGov CMS</span></a><nav><details th:each="entry : ${groups}" open><summary th:text="${entry.key}">그룹</summary><a th:each="f : ${entry.value}" th:href="@{'/admin/features/' + ${f.code}}" th:text="${f.name}" th:classappend="${f.code == feature.code} ? ' active' : ''">기능</a></details></nav></aside><main class="content"><header class="topbar"><div><a th:href="@{/admin}" class="back">← 대시보드</a><span class="pill" th:text="${feature.group}">그룹</span></div><form method="post" th:action="@{/logout}"><button class="ghost">로그아웃</button></form></header><section class="hero compact"><p class="eyebrow" th:text="${feature.code}">code</p><h1 th:text="${feature.name}">기능명</h1><p th:text="${feature.description}">설명</p></section><section class="panel"><div class="panel-head"><div><h2>데이터 목록</h2><p>공통 CRUD 엔진을 사용합니다.</p></div><button class="primary" onclick="document.getElementById('createForm').showModal()">+ 새 항목</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>제목</th><th>내용</th><th>사용</th><th>순서</th><th></th></tr></thead><tbody><tr th:if="${#lists.isEmpty(items)}"><td colspan="6" class="empty">등록된 항목이 없습니다.</td></tr><tr th:each="item : ${items}"><td th:text="${item.id}">1</td><td th:text="${item.title}">제목</td><td th:text="${item.content}">내용</td><td><span th:class="${item.enabled} ? 'status on' : 'status off'" th:text="${item.enabled} ? '사용' : '중지'">사용</span></td><td th:text="${item.sortOrder}">0</td><td class="actions"><button class="ghost small" th:attr="onclick=|document.getElementById('edit-${item.id}').showModal()|">수정</button><form method="post" th:action="@{'/admin/features/' + ${feature.code} + '/' + ${item.id} + '/delete'}"><button class="danger small">삭제</button></form></td></tr></tbody></table></div></section></main></div><dialog id="createForm"><form method="post" th:action="@{'/admin/features/' + ${feature.code}}" class="dialog-form"><div class="dialog-head"><h3>항목 등록</h3><button type="button" onclick="this.closest('dialog').close()">×</button></div><label>제목<input name="title" required></label><label>내용<textarea name="content" rows="5"></textarea></label><div class="form-row"><label>순서<input name="sortOrder" type="number" value="0"></label><label><input name="enabled" type="checkbox" value="true" checked> 사용</label></div><button class="primary">저장</button></form></dialog><dialog th:each="item : ${items}" th:id="'edit-' + ${item.id}"><form method="post" th:action="@{'/admin/features/' + ${feature.code} + '/' + ${item.id} + '/update'}" class="dialog-form"><div class="dialog-head"><h3>항목 수정</h3><button type="button" onclick="this.closest('dialog').close()">×</button></div><label>제목<input name="title" th:value="${item.title}" required></label><label>내용<textarea name="content" rows="5" th:text="${item.content}"></textarea></label><div class="form-row"><label>순서<input name="sortOrder" type="number" th:value="${item.sortOrder}"></label><label><input name="enabled" type="checkbox" value="true" th:checked="${item.enabled}"> 사용</label></div><button class="primary">변경 저장</button></form></dialog></body></html>
