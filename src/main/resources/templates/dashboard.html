<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMS 대시보드</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="shell"><aside class="sidebar"><a class="brand" th:href="@{/admin}"><span class="brand-mark">eG</span><span>eGov CMS</span></a><nav><details th:each="entry : ${groups}" open><summary th:text="${entry.key}">그룹</summary><a th:each="f : ${entry.value}" th:href="@{'/admin/features/' + ${f.code}}" th:text="${f.name}">기능</a></details></nav></aside><main class="content"><header class="topbar"><div><strong>운영 대시보드</strong><span class="pill">eGovFrame 5.0</span></div><form method="post" th:action="@{/logout}"><button class="ghost">로그아웃</button></form></header><section class="hero"><p class="eyebrow">CMS CONTROL CENTER</p><h1>50개 관리 기능을 하나의 운영 화면에서</h1><p>기본설정, 메뉴, 권한, 회원, 게시판부터 로그·통계·API·점검까지 공통 CRUD 패턴으로 관리합니다.</p></section><section class="stats"><article><span>기능 모듈</span><strong th:text="${featureCount}">50</strong></article><article><span>등록 메뉴</span><strong th:text="${menuCount}">0</strong></article><article><span>회원 샘플</span><strong th:text="${memberCount}">0</strong></article><article><span>게시글 샘플</span><strong th:text="${postCount}">0</strong></article></section><section class="panel"><div class="panel-head"><div><h2>관리 기능</h2><p>카테고리를 선택해 데이터 등록/수정/삭제를 확인하세요.</p></div></div><div class="feature-grid"><a th:each="f : ${T(kr.co.yadoc.cms.domain.FeatureCatalog).FEATURES}" th:href="@{'/admin/features/' + ${f.code}}" class="feature-card"><span th:text="${f.group}">그룹</span><strong th:text="${f.name}">이름</strong><small th:text="${f.description}">설명</small></a></div></section></main></div></body></html>
