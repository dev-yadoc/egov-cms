server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: egov-cms-demo
  datasource:
    url: jdbc:h2:file:./data/egovcms;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false
logging:
  level:
    root: INFO
    kr.co.yadoc.cms: DEBUG
